name: contributor automation

on:
  schedule: 
    - cron: '0 0 * * *'      
    
  # Changed from pull_request to pull_request_target
  pull_request_target:
    types: [closed]
    branches:
      - main
      
  workflow_dispatch:
  
permissions:
  contents: write

jobs:
  update-readme:
    # Ensure it only executes actual MERGED pull requests, not just closed ones
    if: github.event_name != 'pull_request_target' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Critical for pull_request_target to check out the target branch (main) correctly
          ref: ${{ github.event.repository.default_branch }}

      - name: Fetch Merged PR Authors (Pagination)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          
          PAGE=1
          echo "[]" > final_list.json
          while true; do
            RESPONSE=$(gh api "/repos/itsdakshjain/test/pulls?state=closed&per_page=100&page=${PAGE}")
            COUNT=$(echo "$RESPONSE" | jq '. | length')
            if [ "$COUNT" -eq 0 ]; then break; fi
            jq -s '.[0] + .[1]' final_list.json <(echo "$RESPONSE") > tmp.json && mv tmp.json final_list.json
            PAGE=$((PAGE + 1))
          done
          
          jq '[.[] 
            | select(.merged_at != null and .user != null and .user.type != "Bot") 
            | .user.login] 
            | unique 
            | sort' final_list.json > contributors.json

      - name: Build Gallery HTML
        run: |
          set -euo pipefail
          GALLERY_HTML=""
          for USERNAME in $(jq -r '.[]' contributors.json); do
            GALLERY_HTML="${GALLERY_HTML}<a href=\"https://github.com/${USERNAME}\"><img src=\"https://github.com/${USERNAME}.png\" width=\"50px\" loading=\"lazy\" title=\"${USERNAME}\" style=\"border-radius:50%;margin:5px;\" alt=\"${USERNAME}\" /></a>"
          done
          echo "$GALLERY_HTML" > gallery_fragment.txt

      - name: Update README.md
        run: |
          set -euo pipefail
          
          start_count=$(grep -c '' README.md || true)
          end_count=$(grep -c '' README.md || true)
          if [ "$start_count" -ne 1 ] || [ "$end_count" -ne 1 ]; then
            echo "Error: README.md must contain exactly one pair of markers."
            exit 1
          fi

          # Use AWK to safely regenerate the file by replacing everything 
          # between START and END with the contents of gallery_fragment.txt
          awk '
            // { print; system("cat gallery_fragment.txt"); skip=1; next }
            // { skip=0 }
            !skip
          ' README.md > README.tmp && mv README.tmp README.md
 
      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add README.md
          
          if git diff --staged --quiet; then
            echo "No changes to README."
          else
            git commit -m "update contributor list [skip ci]"
            # Explicitly target main (or fallback dynamically to target base branch)
            TARGET_BRANCH="${{ github.event.pull_request.base.ref || github.ref_name }}"
            git push origin HEAD:"$TARGET_BRANCH"
          fi
